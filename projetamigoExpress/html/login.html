<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connexion - AmigoExpress</title>
  

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  
  <!-- Google Fonts (Inter) -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Votre fichier CSS principal -->
  <link rel="stylesheet" href="../css/login.css">
</head>
<body class="login-page-body">

  <div class="login-wrapper">
    <div class="login-card">
      
      <!-- En-tête -->
      <div class="login-header">
        <h1>Login</h1>
        <p>Good to see you again!</p>
      </div>

      <!-- Boutons sociaux -->
      <div class="social-login">
        <button class="btn-social">
          <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg" alt="Google" class="social-icon">
          Continue with Google
        </button>
        <button class="btn-social">
          <i class="fa-brands fa-facebook" style="color: #1877F2; font-size: 24px;"></i>
          Continue with Facebook
        </button>
      </div>

      <!-- Séparateur -->
      <div class="separator">
        <span>or</span>
      </div>

      <!-- Formulaire -->
      <form class="login-form" action="#" method="POST">
        
        <!-- Champ Nom d'utilisateur / Email -->
        <div class="form-group">
          <label for="username">Username or email <span class="required">*</span></label>
          <input type="text" id="username" name="username" placeholder="Username or email" required>
        </div>

        <!-- Champ Mot de passe -->
        <div class="form-group">
          <label for="password">Password <span class="required">*</span></label>
          <div class="password-wrapper">
            <input type="password" id="password" name="password" placeholder="Password" required>
            <button type="button" class="toggle-password" aria-label="Afficher le mot de passe">
              <i class="fa-solid fa-eye"></i>
            </button>
          </div>
        </div>

        <!-- Options (Remember me / Forgot password) -->
        <div class="form-options">
          <label class="checkbox-container">
            <input type="checkbox" name="remember">
            <span class="checkmark"></span>
            Remember me
          </label>
          <a href="#" class="forgot-link">I forgot my password</a>
        </div>

        <!-- Bouton de connexion -->
        <button type="submit" class="btn-submit">Continue</button>
      </form>

      <!-- Lien d'inscription -->
      <div class="login-footer">
        <p>New to Kangaride? <a href="#">Sign up</a></p>
      </div>

    </div>
  </div>

</body>
</html>
